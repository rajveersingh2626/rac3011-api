services:
  postgres:
    image: postgres:16-alpine
    container_name: rac3011-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rac3011}
      POSTGRES_USER: ${POSTGRES_USER:-rac3011}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Mt33@raman33}
    command: >
      postgres
      -c shared_buffers=6GB
      -c effective_cache_size=18GB
      -c maintenance_work_mem=1GB
      -c work_mem=32MB
      -c max_connections=250
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rac3011} -d ${POSTGRES_DB:-rac3011}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rac3011-redis
    restart: always
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rac3011-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=4096'
      DATABASE_URL: postgresql://${POSTGRES_USER:-rac3011}:${POSTGRES_PASSWORD:-Mt33%40raman33}@postgres:5432/${POSTGRES_DB:-rac3011}?connection_limit=30&pool_timeout=10
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rac3011-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WORKER: 1
      NODE_OPTIONS: '--max-old-space-size=2048'
      DATABASE_URL: postgresql://${POSTGRES_USER:-rac3011}:${POSTGRES_PASSWORD:-Mt33%40raman33}@postgres:5432/${POSTGRES_DB:-rac3011}?connection_limit=15&pool_timeout=10
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/src/main.js"]

  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rac3011-studio
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rac3011}:${POSTGRES_PASSWORD:-Mt33%40raman33}@postgres:5432/${POSTGRES_DB:-rac3011}
    ports:
      - '127.0.0.1:5555:5555'
    command: ["npx", "prisma", "studio", "--port", "5555", "--hostname", "0.0.0.0"]

  web:
    build:
      context: ../rac3011-web
      dockerfile: Dockerfile
      args:
        VITE_API_ORIGIN: https://api.rotaract3011.org
    container_name: rac3011-web
    restart: always
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../rac3011-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../ssl:/etc/nginx/ssl:ro

  web-preprod:
    build:
      context: ../rac3011-web-preprod
      dockerfile: Dockerfile
      args:
        VITE_API_ORIGIN: https://api.rotaract3011.org
    container_name: rac3011-web-preprod
    restart: always
    expose:
      - '80'
    volumes:
      - ../rac3011-web-preprod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../ssl:/etc/nginx/ssl:ro

volumes:
  postgres_data:
  redis_data:
