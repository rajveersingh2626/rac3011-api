name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: rac3011
          POSTGRES_USER: rac3011
          POSTGRES_PASSWORD: rac3011
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U rac3011 -d rac3011"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://rac3011:rac3011@localhost:5434/rac3011
      SHADOW_DATABASE_URL: postgresql://rac3011:rac3011@localhost:5434/rac3011_shadow
      NODE_ENV: test
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx prisma validate
      - run: npm run test
      - run: npm run test:e2e
      - name: Migration replay on a fresh database
        run: |
          psql "$DATABASE_URL" -c 'DROP DATABASE IF EXISTS rac3011_replay' -c 'CREATE DATABASE rac3011_replay'
          DATABASE_URL=postgresql://rac3011:rac3011@localhost:5434/rac3011_replay npx prisma migrate deploy
          DATABASE_URL=postgresql://rac3011:rac3011@localhost:5434/rac3011_replay npx tsx prisma/seed-system.ts
      - run: npm run build

  image:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: useblacksmith/setup-docker-builder@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rac3011-api
          tags: |
            type=raw,value=main
            type=sha
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Point Dokploy apps to the new image and redeploy
        if: ${{ vars.DOKPLOY_BASE_URL != '' }}
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_BASE_URL: ${{ vars.DOKPLOY_BASE_URL }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/rac3011-api:main
        run: |
          for APP_ID in "${{ vars.DOKPLOY_API_APPLICATION_ID }}" "${{ vars.DOKPLOY_WORKER_APPLICATION_ID }}"; do
            [ -z "$APP_ID" ] && continue
            curl --fail-with-body --silent --show-error --request POST \
              "$DOKPLOY_BASE_URL/api/application.saveDockerProvider" \
              --header "Content-Type: application/json" \
              --header "x-api-key: $DOKPLOY_API_KEY" \
              --data "$(jq -n --arg id "$APP_ID" --arg img "$IMAGE" '{applicationId:$id, dockerImage:$img}')"
            curl --fail-with-body --silent --show-error --request POST \
              "$DOKPLOY_BASE_URL/api/application.redeploy" \
              --header "Content-Type: application/json" \
              --header "x-api-key: $DOKPLOY_API_KEY" \
              --data "$(jq -n --arg id "$APP_ID" --arg t "CI deploy" --arg d "${{ github.sha }}" '{applicationId:$id, title:$t, description:$d}')"
          done
